
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>third-post</title>
    <link rel="stylesheet" href="/assets/normalize.css">
    <style>
    .toggle-icon {
        cursor: pointer;
        display: inline-block;
    }
    .triangle-toggle {
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 8px solid #333;
        cursor: pointer;
        transition: transform 0.3s ease;
        display: inline-block;
        vertical-align: middle;
        margin-right: 6px;
        margin-left: -14px; /* Move the icon outside the text area like default markers */
        transform: rotate(-90deg); /* Points right by default */
    }
    .triangle-toggle.toggled {
        transform: rotate(0deg); /* Points down when toggled */
    }
    li.has-toggle {
        list-style-type: none;
    }
</style>
</head>
<body>
    <header>
        <nav><a href="/">Home</a> / <a href="/posts/index.html">posts</a> / <a href="/posts/2025/index.html">2025</a> / <a href="/posts/2025/07/index.html">07</a> / <a href="/posts/2025/07/third-post.html">third-post</a></nav>
    </header>
    <main>
        <p>세 번째 게시물입니다. 이 게시물은 특정 주제에 대한 짧은 글입니다.</p>

    </main>
    <footer>
        <p>Generated by Static Blog Generator</p>
    </footer>

<script>
    function attachToggleListeners() {
        document.querySelectorAll('.toggle-icon').forEach(icon => {
            // Remove existing listener to prevent duplicates if called multiple times
            icon.removeEventListener('click', handleToggleClick);
            icon.addEventListener('click', handleToggleClick);
        });
    }

    async function handleToggleClick(event) {
        event.preventDefault();
        const icon = event.currentTarget;
        console.log('Toggle icon clicked:', icon);
        const content = icon.parentElement.querySelector('.toggle-content');
        if (content && content.classList.contains('toggle-content')) {
            const src = content.dataset.src;
            if (src && !content.dataset.loaded) {
                console.log('Current Pathname:', window.location.pathname);
                console.log('Current Pathname:', window.location.pathname);
                console.log('Fetching URL:', src);
                try {
                    const response = await fetch(src);
                    if (!response.ok) {
                        throw new Error('HTTP error! status: ' + response.status);
                    }
                    const html = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const mainElement = doc.querySelector('main');
                    if (mainElement) {
                        content.innerHTML = mainElement.innerHTML;
                        attachToggleListeners(); // Re-attach listeners to newly loaded content
                    } else {
                        content.innerHTML = '<p>Error: Content could not be loaded.</p>';
                    }
                    content.dataset.loaded = 'true'; // Mark as loaded
                } catch (e) {
                    console.error('Failed to load content:', e);
                    content.innerHTML = '<p>Error loading content.</p>';
                }
            }

            if (content.style.display === 'none' || content.style.display === '') {
                content.style.display = 'block';
                icon.parentElement.querySelector('.triangle-toggle')?.classList.add('toggled');
            } else {
                content.style.display = 'none';
                icon.parentElement.querySelector('.triangle-toggle')?.classList.remove('toggled');
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        console.log('DOM fully loaded and parsed. Attaching initial toggle listeners.');
        attachToggleListeners();
    });
</script>
