
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>second-post</title>
    <style>
        .toggle-icon {
            cursor: pointer;
            display: inline-block;
            width: 1em; /* Adjust as needed */
        }
    </style>
</head>
<body>
    <header>
        
        <span class="toggle-icon">▶</span>
        <div class="toggle-content" style="display:none;">
            <nav><a href="/">Home</a> / <a href="/posts/index.html">posts</a> / <a href="/posts/2025/index.html">2025</a> / <a href="/posts/2025/07/index.html">07</a> / second-post</nav>
        </div>
    
        <h1>/posts/2025/07/second-post</h1>
    </header>
    <main>
        <p>두 번째 게시물입니다. 이 파일은 좀 더 긴 내용을 가질 수 있습니다. 하지만 데모를 위해 짧게 유지합니다.</p>

    </main>
    <footer>
        <p>Generated by Static Blog Generator</p>
    </footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.toggle-icon').forEach(icon => {
            icon.addEventListener('click', async () => {
                const content = icon.parentElement.querySelector('.toggle-content');
                if (content && content.classList.contains('toggle-content')) {
                    const src = content.dataset.src;
                    if (src && !content.dataset.loaded) {
                        try {
                            const response = await fetch(src);
                            if (!response.ok) {
                                throw new Error('HTTP error! status: ' + response.status);
                            }
                            const html = await response.text();
                            content.innerHTML = html;
                            content.dataset.loaded = 'true'; // Mark as loaded
                        } catch (e) {
                            console.error('Failed to load content:', e);
                            content.innerHTML = '<p>Error loading content.</p>';
                        }
                    }

                    if (content.style.display === 'none' || content.style.display === '') {
                        content.style.display = 'block';
                        icon.textContent = '▼';
                    } else {
                        content.style.display = 'none';
                        icon.textContent = '▶';
                    }
                }
            });
        });
    });
</script>
